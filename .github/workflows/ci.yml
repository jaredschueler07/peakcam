name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Harmless placeholders for modules that validate Supabase env vars at import time
  # (e.g. lib/supabase.ts) when .env.local is absent.
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  check:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No .nvmrc or root package.json#engines, so pin the active LTS.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lift-status parsers have their own small lockfile (scripts/liftie-worker).
      - name: Install lift-status worker dependencies
        run: npm ci --prefix scripts/liftie-worker --no-audit --no-fund

      # Fails on ESLint errors only; warnings are reported without failing.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # No build step on purpose: the build renders resort pages, which call Open-Meteo.
      - name: Unit tests
        run: npm test
